<!doctype html>
<html><head><meta charset="utf-8"><title>Showwork link preview (1200 x 630)</title>
<!-- Rendered to assets/og-image.png by tools/capture-og.mjs. The image is what LinkedIn, Slack and X show when the site is shared. -->
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{font-family:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#14152b;
  background:radial-gradient(900px 500px at 92% 8%,#e3e0fc 0%,transparent 60%),radial-gradient(700px 420px at 0% 100%,#ecebfe 0%,transparent 60%),#f7f8fc}
.wrap{display:grid;grid-template-columns:640px 1fr;height:100%;padding:56px 60px 52px 64px;gap:28px}
.left{display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:14px;font-weight:700;font-size:30px;letter-spacing:-.01em}
.logo{width:46px;height:46px;border-radius:13px;background:linear-gradient(135deg,#5b4fe0,#4f44d8);display:grid;place-items:center}
.logo svg{width:26px;height:26px}
h1{margin-top:44px;font-size:58px;line-height:1.06;letter-spacing:-.03em;font-weight:800}
h1 em{font-style:normal;color:#4f44d8;background:linear-gradient(transparent 66%,#e3e0fc 66%)}
.sub{margin-top:22px;font-size:25px;line-height:1.35;color:#5e6382;max-width:560px}
.chips{margin-top:auto;display:flex;gap:10px;flex-wrap:wrap}
.chip{font-weight:600;font-size:19px;padding:9px 17px;border-radius:999px;background:#fff;border:1.5px solid #e4e6f0;color:#2a2594}
.chip.gate{background:#fff4d6;border-color:#e9b949;color:#8a5300}
.right{position:relative}
.dev{position:absolute;background:#fff;border:1px solid #d9dcee;box-shadow:0 8px 20px rgba(20,21,43,.1),0 28px 60px rgba(20,21,43,.18);overflow:hidden}
.dev img{display:block;width:100%}
.lap{right:0;top:46px;width:440px;border-radius:14px}
.lap .bar{height:26px;background:#eef0f8;border-bottom:1px solid #e4e6f0;display:flex;gap:6px;align-items:center;padding-left:12px}
.lap .bar i{width:9px;height:9px;border-radius:50%;background:#cfd3e6}
.pho{left:-6px;bottom:30px;width:176px;border-radius:26px;border:7px solid #14152b}
.badge{position:absolute;right:18px;bottom:44px;background:#12844d;color:#fff;font-weight:700;font-size:21px;padding:11px 19px;border-radius:999px;box-shadow:0 8px 24px rgba(18,132,77,.35)}
</style></head><body>
<div class="wrap">
  <div class="left">
    <div class="brand"><span class="logo"><svg viewBox="0 0 32 32"><path d="M8 16.5l5.5 5.5L24 10" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>Showwork</div>
    <h1>A ticket goes in. A pull request that <em>proves it works</em> comes out.</h1>
    <p class="sub">AI agents that deliver Jira tickets, tested in a real browser. People approve. Agents never merge.</p>
    <div class="chips"><span class="chip gate">3 human gates</span><span class="chip">Real browser QA</span><span class="chip">Sealed sandbox</span></div>
  </div>
  <div class="right">
    <div class="dev lap"><div class="bar"><i></i><i></i><i></i></div><img src="../assets/shots/evidence-laptop.png" alt=""></div>
    <div class="dev pho"><img src="../assets/shots/evidence-phone.png" alt=""></div>
    <div class="badge">Evidence at 3 sizes</div>
  </div>
</div>
</body></html>
