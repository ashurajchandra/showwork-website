# Deploys the static site to GitHub Pages on every push to main.
# One-time setup in the repository: Settings > Pages > Build and deployment > Source: "GitHub Actions".
# Optional: set a repository variable SITE_URL (for example https://showwork.example.com) for canonical links, sitemap.xml and robots.txt.
name: Deploy site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build pages
        run: node _src/build.mjs
        env:
          SITE_URL: ${{ vars.SITE_URL }}
      - name: Collect the files to publish
        run: |
          mkdir _site
          cp *.html favicon.svg _site/
          cp -r assets _site/assets
          cp robots.txt sitemap.xml _site/ 2>/dev/null || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
